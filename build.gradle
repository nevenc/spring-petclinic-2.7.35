plugins {
  id 'java'
  id 'jacoco'
  id 'org.springframework.boot' version '2.7.35'
  id 'io.spring.dependency-management' version '1.0.15.RELEASE'
  id 'io.spring.javaformat' version '0.0.48'
  id 'io.spring.nohttp' version '0.0.11'
  id 'com.gorylenko.gradle-git-properties' version '2.4.1'
}

group = 'org.springframework.samples'
version = '2.7.35'
description = 'petclinic'

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
  options.encoding = 'UTF-8'
}

repositories {
  mavenCentral()
  // Spring Boot 2.7.35 is an enterprise (Tanzu Spring) release
  maven {
    name = 'springEnterpriseSubscription'
    url = 'https://packages.broadcom.com/artifactory/spring-enterprise/'
    credentials {
      username = findProperty('tanzuArtifactoryUser') ?: System.getenv('TANZU_ARTIFACTORY_USER')
      password = findProperty('tanzuArtifactoryToken') ?: System.getenv('TANZU_ARTIFACTORY_TOKEN')
    }
  }
}

ext.webjarsBootstrapVersion = '5.1.3'
ext.webjarsFontawesomeVersion = '4.7.0'
ext.jacocoVersion = '0.8.7'
ext.checkstyleVersion = '8.45.1'

// Version overrides, mirroring <dependencyManagement> in pom.xml
dependencyManagement {
  dependencies {
    dependencySet(group: 'org.apache.tomcat.embed', version: '9.0.123') {
      entry 'tomcat-embed-core'
      entry 'tomcat-embed-el'
      entry 'tomcat-embed-websocket'
    }
    dependency 'org.aspectj:aspectjweaver:1.9.27'
    dependency 'org.attoparser:attoparser:2.0.10.RELEASE'
    dependency 'org.hibernate.validator:hibernate-validator:6.2.6.Final'
    dependency 'org.jboss:jandex:2.4.5.Final'
    dependency 'org.unbescape:unbescape:1.1.8.RELEASE'
  }
}

dependencies {
  // Spring and Spring Boot dependencies
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'

  // Databases - Uses H2 by default
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'org.postgresql:postgresql'

  // caching
  implementation 'javax.cache:cache-api'
  implementation 'org.ehcache:ehcache'

  // webjars
  implementation "org.webjars.npm:bootstrap:${webjarsBootstrapVersion}"
  implementation "org.webjars.npm:font-awesome:${webjarsFontawesomeVersion}"

  developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.named('test') {
  useJUnitPlatform()
  finalizedBy 'jacocoTestReport'
}

// Spring Boot Actuator displays build-related information
// if a META-INF/build-info.properties file is present
springBoot {
  buildInfo {
    properties {
      additional = [
        'encoding.source'   : 'UTF-8',
        'encoding.reporting': 'UTF-8',
        'java.source'       : java.sourceCompatibility.toString(),
        'java.target'       : java.targetCompatibility.toString()
      ]
    }
  }
}

// Spring Boot Actuator displays git information if a git.properties
// file is present on the classpath
gitProperties {
  dateFormat = "yyyy-MM-dd'T'HH:mm:ssZ"
  failOnNoGitDirectory = false
}

jacoco {
  toolVersion = jacocoVersion
}

// Only the nohttp check is used, as in the Maven build
checkstyle {
  toolVersion = checkstyleVersion
  configDirectory = file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}

tasks.named('checkstyleMain') { enabled = false }
tasks.named('checkstyleTest') { enabled = false }

// Mirrors the excludes in pom.xml and src/checkstyle/nohttp-checkstyle-suppressions.xml
nohttp {
  source.exclude 'target/**', 'bin/**', '.gradle/**', '.idea/**', '**/*.class',
    '**/node_modules/**', '**/node/**', '**/build.log',
    '**/*.jar', '**/*.git', '**/*.ico', '**/*.p12', '**/*.gif', '**/*.jks', '**/*.jpg', '**/*.svg'
}

checkstyleNohttp {
  configDirectory = file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}
